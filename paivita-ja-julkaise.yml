name: Markkinavahti LIVE – päivitä ja julkaise
on:
  workflow_dispatch:
  schedule:
    # NYSE & Nasdaq market close 21:00 or 22:00 UTC depending on DST;
    # 03:40 UTC Tue-Sat is safely after close, but GitHub cron can be late.
    - cron: '40 3 * * 2-6'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: markkinavahti-data-and-pages
  cancel-in-progress: false
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install libraries
        run: python -m pip install -r requirements.txt
      - name: Fetch last completed market session and commodity benchmarks
        run: python scripts/build_live.py
      - name: Store updated observations for trend history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Markkinavahti: paivita markkinadata'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Prepare static site
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/latest.json site/data/latest.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
        id: deploy
