*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header.top{background:#fff;border-bottom:1px solid var(--border);position:sticky;z-index:20;top:0}div.topin{max-width:1230px;margin:auto;min-height:78px;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;background:#143746;color:#fff;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800}.brand strong{display:block;letter-spacing:-.5px;font-size:19px}.brand small{display:block;font-size:11px;color:var(--muted)}.topright{display:flex;gap:12px;align-items:center}.status{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--tag);border-radius:999px;padding:5px 12px;font-weight:650;font-size:12px}.status.live{color:var(--green);background:#e8f6f0}.status.demo{color:#8a5905;background:#fff1d1}.status.missing{color:var(--red);background:#ffeded}.refresh{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 13px;font-size:13px;font-weight:650}.refresh:hover{background:#f1f4f6}

round:linear-gradient(90deg,#b85848 0%,#d79c44 34%,#9eae7a 60%,#37a77c 100%);border-radius:100px;position:relative;margin:24px 0 12px}.pointer{height:23px;width:4px;position:absolute;background:#fff;border-radius:3px;top:-6px;box-shadow:0 0 1px #000}.riskadvice{color:#dce9eb;max-width:700px}.riskfooter{font-size:12px;color:#b5cfd4;margin-top:15px}.comp{margin:18px 0}.comphead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.track{height:8px;border-radius:10px;background:#e7edf0;overflow:hidden}.track>span{height:100%;display:block;background:#317b9b;border-radius:10px}.riskcard .track{background:#345763}.riskcard .track>span{background:#71b8b1}.insight{padding:13px 15px;border:1px solid var(--border);background:#f9fbfc;border-radius:10px;margin-bottom:10px;font-size:14px}.insight:last-child{margin-bottom:0}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{font-size:11px;font-weight:700;border-radius:999px;background:#ecf3f6;padding:5px 10px;color:#40606b}.pill.green{background:#e9f6f0;color:#15785c}.pill.red{background:#fff0ed;color:#b74840}.pill.amber{background:#fff4dd;color:#946409}.btn{border:1px solid var(--border);background:#fff;color:var(--ink);padding:8px 12px;border-radius:9px;font-weight:670;font-size:13px}.btn:hover,.btn.active{background:#183c50;color:#fff;border-color:#183c50}.tablewrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:750px}.data-table th{text-align:left;padding:11px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}.data-table td{padding:13px 9px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}.data-table tbody tr:hover{background:#f6fafb}.data-table tbody tr:last-child td{border-bottom:0}.data-table td strong{font-size:14px}.data-table .numeric{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.data-table .muted{color:var(--muted)}.tag{display:inline-block;font-size:11px;font-weight:650;background:var(--tag);padding:3px 8px;border-radius:6px;white-space:nowrap}.tag.future{color:#226c93;background:#eaf4fa}.tag.month{color:#805a16;background:#f9f0dc}.tag.special{color:#7b4d80;background:#f5ecf8}.tag.no{color:#8a5856;background:#fbeeee}.ticker{display:block;font-size:11px;color:var(--muted);margin-top:3px}.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 19px}.search{border:1px solid var(--border);padding:10px 13px;border-radius:9px;background:white;flex:1;min-width:180px;max-width:320px}.hint{font-size:12px;color:var(--muted);margin:8px 0 13px}.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:680;font-size:12px;padding:0}.numb{font-variant-numeric:tabular-nums}.rowtitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.explain{font-size:13px;color:var(--muted)}.cand{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.cand:last-child{border:0}.candname{font-weight:750}.candsmall{color:var(--muted);font-size:12px}.candright{text-align:right}.score{min-width:46px;font-size:19px;font-weight:780;color:#154f65}.plot{width:100%;height:205px;background:#fbfcfd;border-radius:10px;border:1px solid var(--line);margin-top:13px}.plot text{font-size:10px;fill:#84949e}.chartpanel{padding:17px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-top:15px}.chartpanel h3{margin-bottom:3px}.chartpanel svg{width:100%;height:auto}.warnbox{background:#fff9ec;border:1px solid #ead8ae;border-radius:10px;padding:12px 14px;color:#6f551d;font-size:13px}.source{font-size:12px;color:var(--muted)}.empty{padding:22px;background:#f8fafb;border:1px dashed #cad6dd;border-radius:9px;color:var(--muted);font-size:14px}.foot{padding-top:20px;margin-top:35px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.alert{background:#fff2ee;color:#903f36;border:1px solid #f1c5bb;border-radius:9px;padding:12px 15px;margin:18px 0;font-size:13px}.alert.demo{background:#fff6df;color:#7c5e1e;border-color:#eadbba}.quote{font-size:18px;font-weight:720}.detail{background:#f5f9fa;border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:10px}.reason{display:flex;gap:7px;align-items:baseline;font-size:13px;margin-top:4px}.reason:before{content:'•';color:#66838b}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0}.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.info{border-left:3px solid #3b849d;padding-left:11px;font-size:13px;color:var(--muted);margin:8px 0}.flag{margin-left:auto;color:var(--muted)}
@media(max-width:880px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.cards3{grid-template-columns:1fr}.pagehead h1{font-size:27px}}
@media(max-width:520px){main{padding:18px 13px 60px}.topin{padding:12px 13px}.brand strong{font-size:17px}.topright{gap:4px}.refresh{padding:6px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:12px;min-height:140px}.big{font-size:29px}.pagehead{display:block}.datebadge{margin-top:9px}.riskcard{padding:19px}.card{padding:15px}.nav button{padding:11px 12px;font-size:13px}.filters{gap:6px}.search{max-width:100%}}

<body>
<header class="top"><div class="topin"><div class="brand"><div class="logo">M</div><div><strong>Markkinavahti <span style="color:#74939e">LIVE</span></strong><small>Säännöt ennen tunteita</small></div></div><div class="topright"><span id="mode" class="status missing">Haetaan tietoja</span><button id="reload" class="refresh">↻ Päivitä näkymä</button></div></div></header>
<main><nav class="nav" aria-label="Päänavigaatio"><button class="active" data-page="tilanne">1. Markkinatilanne</button><button data-page="raaka">2. Raaka-aineet</button><button data-page="ostot">3. Ostopaikat</button><button data-page="ohje">4. Tietolähteet ja säännöt</button></nav><div id="feedback"></div><div id="app"></div><div class="foot">Markkinavahti LIVE · Oma tutkimustyökalu, ei sijoitussuositus. Päätöskurssit eivät ole reaaliaikaisia välityskursseja. Pörssidatan kaupallinen käyttö ja uudelleenjakelu edellyttävät lähteiden käyttöoikeuksien selvittämistä.</div></main>
<script>
'use strict';
const PREFERRED=[
  ['uraani',['uranium'],'Uraani U₃O₈'],
  ['litiumkarbonaatti',['lithium_smm','lithium'],'Litiumkarbonaatti (akku)'],
  ['litiumhydroksidi',['lithium_hydroxide_smm','lithium_hydroxide'],'Litiumhydroksidi (akku)'],
  ['volframi',['tungsten','tungsten_ise'],'Volframi (APT / muu muoto)'],
  ['vanadiini',['vanadium'],'Vanadiini V₂O₅'],
  ['magnesium',['magnesium'],'Magnesium'],
  ['ndpr',['neodymium','neodymium_ise'],'NdPr-oksidi / neodyymi'],
  ['dysprosium',['dysprosium','dysprosium_ise'],'Dysprosiumoksidi / metalli'],
  ['terbium',['terbium','terbium_ise'],'Terbiumoksidi / metalli'],
  ['antimoni',['antimony','antimony_ise'],'Antimoni'],
  ['gallium',['gallium','gallium_ise'],'Gallium'],
  ['germanium',['germanium','germanium_ise'],'Germanium'],
  ['bauksiitti',['bauxite'],'Bauksiitti'],
  ['kupari',['lme_copper_cash','copper_china_smm','future:HG=F','copper'],'Kupari'],
  ['kulta',['future:GC=F','gold'],'Kulta'],
];
const $=id=>document.getElementById(id);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(n,d=1)=>n===null||n===undefined||!Number.isFinite(Number(n))?'—':new Intl.NumberFormat('fi-FI',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n));
const pct=(n,d=1)=>n===null||n===undefined?'—':(Number(n)>0?'+':'')+nf(n,d)+' %';
const cls=n=>n===null||n===undefined?'':Number(n)>0?'good':Number(n)<0?'bad':'';
const strDate=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('fi-FI'):'ei saatavilla';
const readableDate=d=>d?strDate(d):'ei saatavilla';
const safeLink=(url)=>/^https:\/\/[a-z0-9.-]+\//i.test(url||'')?url:'#';
let DB=null, MODE='missing', PAGE='tilanne', rawFilter='prior',rawSearch='',stockFilter='kaikki',stockSearch='',stockSector='kaikki',selectedRaw='',selectedStock='';
function fmtPrice(n,unit){return n===null||n===undefined?'Ei saatavilla':nf(n, Math.abs(n)<1?4:Math.abs(n)<20?3:2)+' '+h(unit||'');}
function fetchDate(d){return d?.meta?.market_date||null}
function gradeSignal(signal){return signal==='Nousutrendin ostopaikka'?'green':signal==='Käänne tarkkailuun'?'amber':signal==='Ylimyyty – odota vahvistusta'?'red':''}
function activeNav(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===PAGE));}
function sectionHeader(title,lead){return `<div class="pagehead"><div><h1>${h(title)}</h1><p>${h(lead)}</p></div><div class="datebadge">Viimeisin indeksipäivä: <strong>${strDate(fetchDate(DB))}</strong></div></div>`}
function scoreDesc(r){if(!r||r.score==null)return 'Markkinasta ei ole vielä riittävää tietoa riskitilan muodostamiseen.';if(r.stale)return 'Saatavilla oleva markkinadata on vanhentunut. Tarkista päivitysloki ennen päätöksiä.';switch(r.label){case 'Puolusta':return 'Riski-indikaattorit puoltavat varovaisuutta. Vältä kiirettä uusissa taktisissa ostoissa; tarkkaile käänteen vahvistumista.';case 'Varovaisuus':return 'Osa mittareista tukee laskuriskiä. Suosi pieniä, vaiheittaisia ostoja vasta vahvistuksen jälkeen.';case 'Neutraali':return 'Signaalit ovat ristiriitaisia. Etsi yksittäisten yhtiöiden vahvoja rakenteita ja pidä riskirajat selvinä.';default:return 'Trendin ja riskimittareiden yhteiskuva on myönteinen; tämä ei yksin tee osakkeesta ostopaikkaa.'}}
function mcard(title,value,description,extra,klass=''){return `<div class="card metric"><h3>${h(title)}</h3><div class="big ${klass}">${value}</div><div class="mini">${description}</div><div class="mini">${extra||''}</div></div>`}
function metricIntro(){const b=DB?.breadth||{}, v=DB?.vix||{}, f=DB?.fear||{},r=DB?.risk||{};
 const fc=f.value===null||f.value===undefined?'—':nf(f.value,0);const vv=v.value===null||v.value===undefined?'—':nf(v.value,1);
 return `<div class="grid metrics">${mcard('VIX · volatiliteetti',vv,v.value==null?'Lähde ei saatavilla':v.value>=30?'Korkea: markkinapaine':v.value>=20?'Kohonnut':'Maltillinen',`Cboe · ${strDate(v.date)}`,v.value>=25?'bad':v.value<20?'good':'warn')}${mcard('Fear & Greed',fc,f.value==null?'Lähde ei saatavilla':f.value<=25?'Pelko / äärimmäinen pelko':f.value>=75?'Äärimmäinen ahneus':f.value>=55?'Ahneus':'Neutraali / pelko',`${h(f.source||'')} · ${strDate(f.date)}`,f.value!=null&&f.value<25?'bad':'')}${mcard('S&P 500 yli SMA50',b.p50==null?'—':nf(b.p50,1)+' %',`Alle keskiarvon: <strong>${b.p50==null?'—':nf(100-b.p50,1)+' %'}</strong>`,`SMA20 yläpuolella: ${b.p20==null?'—':nf(b.p20,1)+' %'} · Kattavuus ${nf(b.coverage||0,1)} % · ${strDate(b.date)}`,b.p50!=null&&b.p50<40?'bad':'')}${mcard('S&P 500 yli SMA200',b.p200==null?'—':nf(b.p200,1)+' %',`Alle keskiarvon: <strong>${b.p200==null?'—':nf(100-b.p200,1)+' %'}</strong>`,`Laskettu ${h(b.included??'—')} / ${h(b.universe??'—')} osakesarjasta`,b.p200!=null&&b.p200<50?'bad':'')}</div>`}
function insights(){const risk=DB?.risk||{},b=DB?.breadth||{},v=DB?.vix||{},f=DB?.fear||{},spy=DB?.indices?.SPY;
 let a=[];
 if(b.p20!=null)a.push(`<strong>${nf(100-b.p20,1)} %</strong> osakesarjoista on 20 päivän keskiarvon alapuolella.`);
 if(b.p50!=null)a.push(`<strong>${nf(100-b.p50,1)} %</strong> mukana olevista S&P 500 -osakesarjoista on 50 päivän keskiarvon alapuolella.`);
 if(b.p200!=null)a.push(`<strong>${nf(100-b.p200,1)} %</strong> on 200 päivän keskiarvon alapuolella. Tämä kertoo trendin osallistumisen laajuudesta.`);
 if(v.value!=null)a.push(`VIX on <strong>${nf(v.value,1)}</strong>${v.value>=30?' – poikkeuksellisen korkean epävarmuuden alueella':v.value>=20?' – korostuneen heilunnan alueella':' – toistaiseksi maltillisella tasolla'}.`);
 if(spy?.dist200!=null)a.push(`SPY on <strong>${pct(spy.dist200)}</strong> suhteessa 200 päivän keskiarvoonsa. Vuoden huipusta: <strong>${pct(spy.drawdown_1y)}</strong>.`);
 if(f.value!=null&&f.value<25)a.push('Fear & Greed kertoo voimakkaasta pelosta, mutta pelko ei yksin vahvista markkinapohjaa.');
 if(b.p200==null)a.push('S&P 500:n markkinaleveyttä ei voitu vahvistaa riittävällä aineistolla; riskiluku on osittainen.');
 if(!a.length)a.push('Odotetaan validia markkinadataa.');
 return a.slice(0,6).map(x=>`<div class="insight">${x}</div>`).join('')}
function riskPanel(){const r=DB?.risk||{},pts=r.score==null?null:r.score, color=pts==null?'':pts<35?'#bd7164':pts<55?'#d4aa5f':pts<75?'#aabf90':'#6dbda2';
 const comp=(r.components||[]).map(x=>`<div class="comp"><div class="comphead"><span>${h(x.name)}</span><strong>${x.points}/${x.max}</strong></div><div class="track"><span style="width:${Math.round(100*x.points/x.max)}%"></span></div></div>`).join('');
 return `<div class="grid two section"><div class="card riskcard"><div class="risktop"><div><div class="kicker">Yhteenveto · sääntöpohjainen arvio</div><h2>${h(r.label||'Tietoa ei ole')}</h2></div><div class="riskscore">${pts==null?'—':pts}<span style="font-size:16px;color:#adc7ce"> /100</span></div></div><div class="riskbar"><span class="pointer" style="left:${pts==null?0:Math.min(99,Math.max(1,pts))}%"></span></div><div class="riskadvice">${h(scoreDesc(r))}</div><div class="riskfooter">${r.complete?'Kaikki 4 mittariryhmää saatavilla':'Osittainen pisteytys'} · kattavuus ${r.coverage||0}/100${r.stale?' · VANHENTUNUT DATA':''}</div></div><div class="card"><div class="rowtitle"><h2>Mistä tulkinta syntyy?</h2><span class="pill">Painot näkyvissä</span></div>${comp||'<div class="empty">Mittariryhmien pisteitä ei vielä saatavilla.</div>'}<div class="info">VIX ja Fear & Greed ovat osin korreloituneita. Pisteytys on läpinäkyvä heuristiikka, ei ennusteen onnistumisen todiste.</div></div></div>`}
function strongestStockRows(limit=4){let candidates=(DB?.stocks||[]).filter(x=>x.date===fetchDate(DB)&&['Nousutrendin ostopaikka','Käänne tarkkailuun'].includes(x.setup));candidates.sort((a,b)=>b.setup_score-a.setup_score);const seen=new Set();const unique=[];for(const x of candidates){if(!seen.has(x.sector)){unique.push(x);seen.add(x.sector)}if(unique.length>=limit)break}return unique;}
function front(){const picks=strongestStockRows();
 const rec=picks.length?picks.map(x=>`<div class="cand"><div><div class="candname">${h(x.name)}</div><div class="candsmall">${h(x.ticker)} · ${h(x.sector)}</div><span class="pill ${gradeSignal(x.setup)}">${h(x.setup)}</span></div><div class="candright"><span class="score">${x.setup_score}</span><div class="candsmall">RSI ${nf(x.rsi)} · vol ${nf(x.volume_ratio,2)}×</div></div></div>`).join(''):'<div class="empty">Yksikään seurattu osake ei tällä hetkellä täytä vahvistetun ostopaikan tai käänteen tarkkailun ehtoja. Tämä on myös hyödyllinen tulos.</div>';
 return sectionHeader('Missä markkina menee?','Neljä keskeistä riskimittaria yhdessä. Näet ensin yleiskuvan, sitten raaka-aineet ja yksittäisten osakkeiden tekniset asetelmat.')+metricIntro()+riskPanel()+`<div class="grid two section"><div class="card"><div class="rowtitle"><h2>Mitä mittarit kertovat?</h2><span class="pill">Automaattinen tulkinta</span></div>${insights()}</div><div class="card"><div class="rowtitle"><h2>Teknisesti kiinnostavat</h2><button class="linkbtn" data-go="ostot">Kaikki ostopaikat ↗</button></div>${rec}</div></div>`+renderSectorSummary();}
function renderSectorSummary(){const sectors=[...(DB?.sectors||[])].filter(x=>x.rel20!==null&&x.rel20!==undefined).sort((a,b)=>b.rel20-a.rel20);const top=sectors.slice(0,4);

function category(r){if(!r)return 'no';if(r.type==='futuuri'||r.type==='fyysinen päivähinta')return 'future';if(r.type==='fyysinen viiveellinen')return 'special';if(r.type==='erikoismetalli')return r.price==null?'no':'special';return 'month';}

 </tbody></table></div></div><div class="card section"><h2>Datayhteyksien tilanne</h2><div class="tablewrap"><table class="data-table"><thead><tr><th>Tietoryhmä</th><th>Tila</th><th>Havaintopäivä</th><th>Lähde</th></tr></thead><tbody>${(DB?.sources_status||[]).map(s=>`<tr><td>${h(s.name)}</td><td>${s.available?'Saatavilla':'Puuttuu'}</td><td>${strDate(s.date)}</td><td>${h(s.source)}</td></tr>`).join('')||'<tr><td colspan="4">Ei vielä päivitettyä dataa.</td></tr>'}</tbody></table></div></div><div class="card section"><h2>Aineiston tarkistus</h2><div class="sub">Ajettu päivitys: ${h(DB?.meta?.built_at_utc||'ei saatavilla')} · ${h(DB?.meta?.mode||'ei live-dataa')} · markkinapäivä ${strDate(fetchDate(DB))}</div>${(DB?.meta?.errors||[]).length?`<div class="alert">Lähdevirheet:<div>${(DB.meta.errors||[]).map(e=>`<div>• ${h(e)}</div>`).join('')}</div></div>`:'<p class="hint">Ei raportoituja lähdevirheitä (ei takaa, että kaikkien sarjojen viimeisin hinta olisi tämän päivän).</p>'}</div>`;}
function render(){activeNav();$('app').innerHTML=PAGE==='tilanne'?front():PAGE==='raaka'?renderCommodities():PAGE==='ostot'?renderStocks():renderMethod(); const bad=[];if(MODE==='missing')bad.push('<div class="alert"><strong>Markkinadataa ei ole vielä haettu.</strong> Tämä oikeaan dataan perustuva sovellus avautuu käyttöön vasta, kun GitHub Pages -julkaisun ensimmäinen ajastettu tai manuaalinen päivitys on onnistunut. Tietoja ei korvata keksityillä luvuilla.</div>');if(MODE==='live'&&DB?.risk?.stale)bad.push('<div class="alert">Pörssidata on vanhentunut. Viimeisin SPY-havainto: '+strDate(DB.meta.market_date)+'. Tarkista Actions-ajon onnistuminen.</div>');$('feedback').innerHTML=bad.join('');$('mode').className='status '+(MODE==='live'?'live':MODE==='demo'?'demo':'missing');$('mode').textContent=MODE==='live'?'● Lähteistä haettu data':'● Ei live-dataa';}
function emptyData(){return {meta:{version:'3.0',mode:'missing',market_date:null,errors:[]},risk:{label:'Odotetaan live-dataa',score:null,coverage:0,components:[]},indices:{},breadth:{},vix:{},fear:{},sectors:[],themes:[],stocks:[],commodities:[]}}
async function load(){try{const resp=await fetch('./data/latest.json?v='+Date.now(),{cache:'no-store'});if(!resp.ok)throw new Error('Puuttuva latest.json');let data=await resp.json();if(data?.meta?.mode!=='live'||!data?.indices?.SPY?.date)throw new Error('Datatiedosto ei ollut kelvollinen live-snapshot');DB=data;MODE='live';}catch(err){DB=emptyData();MODE='missing';}render();}
function navigate(name){PAGE=name;selectedRaw='';selectedStock='';render();window.scrollTo({top:0,behavior:'auto'});}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}
 const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}
 const raw=e.target.closest('[data-raw]');if(raw){selectedRaw=raw.dataset.raw;render();$('rawdetail')?.scrollIntoView({block:'nearest',behavior:'smooth'});return}
 const sf=e.target.closest('[data-stockfilter]');if(sf){stockFilter=sf.dataset.stockfilter;selectedStock='';render();return}
 const rf=e.target.closest('[data-rawfilter]');if(rf){rawFilter=rf.dataset.rawfilter;selectedRaw='';render();return}
 const so=e.target.closest('[data-stock]');if(so){selectedStock=so.dataset.stock;render();$('stockdetail')?.scrollIntoView({block:'nearest',behavior:'smooth'});return}
 const close=e.target.closest('[data-close]');if(close){if(close.dataset.close==='raw')selectedRaw='';else selectedStock='';render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='rawsearch'){rawSearch=e.target.value.toLocaleLowerCase('fi-FI');const pos=e.target.selectionStart;render();const el=$('rawsearch');el?.focus();el?.setSelectionRange(pos,pos)}if(e.target.id==='stocksearch'){stockSearch=e.target.value.toLocaleLowerCase('fi-FI');const pos=e.target.selectionStart;render();const el=$('stocksearch');el?.focus();el?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='stocksector'){stockSector=e.target.value;render();}});
$('reload').addEventListener('click',()=>load());load();
</script></body></html>
